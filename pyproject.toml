[project]
name = "fault-finder"
version = "0.1.0"
description = "FaultFinder: a maintenance fault-investigation agent (portfolio project, synthetic data only)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "langgraph>=0.2",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2.5",
  "pyyaml>=6.0",
  "pypdf>=4.0",
  "openai>=1.30",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
