# Database only. The app runs locally (make run). Port 5433 avoids clashing
# with a locally installed PostgreSQL.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: faultfinder
      POSTGRES_PASSWORD: faultfinder   # local dev only
      POSTGRES_DB: faultfinder
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultfinder"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
